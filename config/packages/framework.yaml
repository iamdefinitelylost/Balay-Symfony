framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    csrf_protection: true
    session:
        cookie_httponly: true
        cookie_samesite: lax
        cookie_secure: auto
    php_errors:
        log: true
    mailer:
        dsn: '%env(MAILER_DSN)%'
