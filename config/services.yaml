parameters:
    uploads_dir: '%kernel.project_dir%/public/uploads'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Security/AppUser.php'

    # Plain DBAL connection (replaces db() / PDO in config.php). Values come from .env / docker-compose.
    Doctrine\DBAL\Connection:
        factory: ['Doctrine\DBAL\DriverManager', 'getConnection']
        arguments:
            $params:
                driver: pdo_mysql
                host: '%env(DB_HOST)%'
                port: '%env(int:DB_PORT)%'
                dbname: '%env(DB_NAME)%'
                user: '%env(DB_USER)%'
                password: '%env(DB_PASSWORD)%'
                charset: utf8mb4
