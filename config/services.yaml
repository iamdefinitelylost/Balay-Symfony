parameters:
    uploads_dir: '%kernel.project_dir%/public/uploads'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Entity/'

    # Doctrine\DBAL\Connection (used by the public JSON API) and the EntityManager
    # are provided by DoctrineBundle, configured in config/packages/doctrine.yaml.
