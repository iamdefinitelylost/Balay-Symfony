parameters:
    uploads_dir: '%kernel.project_dir%/public/uploads'
    # Defaults for local Docker development; override with real environment variables in production.
    env(APP_URL): 'http://localhost:8080'
    env(MAIL_FROM): 'Balay <no-reply@balay.test>'
    env(MAILER_DSN): 'smtp://mailpit:1025'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Entity/'

    # Doctrine\DBAL\Connection (used by the public JSON API) and the EntityManager
    # are provided by DoctrineBundle, configured in config/packages/doctrine.yaml.
