server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    client_max_body_size 64M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Only the Symfony front controller is ever executed.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Replaces uploads/.htaccess: any other .php (e.g. one uploaded into /uploads) is never run.
    location ~ \.php$ {
        return 404;
    }

    location /uploads/ {
        autoindex off;
        try_files $uri =404;
    }
}
